xense_camera:
  ros__parameters:

    # --- Device selection ---
    device_serial: ""
    device_index: -1

    # --- Stream enable flags ---
    enable_raw: false               # ~/raw/image_raw          (640x480 bgr8)
    enable_rectified: true          # ~/rectified/image         (400x700 bgr8)
    enable_diff_single: false       # ~/diff/single/image       (400x700 bgr8, fast)
    enable_diff_continuous: false   # ~/diff/continuous/image   (400x700 bgr8, accurate)

    # Note: enable_diff_single and enable_diff_continuous are mutually exclusive.
    # If both are set, continuous takes priority and a warning is logged.

    # --- Processing options ---
    inference_backend: "Auto"
    use_gpu: true

    # --- QoS ---
    # true  = RELIABLE   (compatible with rviz2, rqt plugins)
    # false = BEST_EFFORT (lower overhead, use with custom C++ subscribers)
    qos_reliable: true

    # --- TF / coordinate frames ---
    camera_frame_id: "xense_camera_link"
    publish_tf: true
